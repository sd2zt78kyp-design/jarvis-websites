<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stern Elektro GmbH | Elektriker in Rosenheim</title>
<meta name="description" content="Stern Elektro GmbH – Ihr zuverlässiger Elektriker in Rosenheim. Elektroinstallation, Notdienst, Smart Home und mehr aus einer Hand.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: #1f2933;
    line-height: 1.6;
    background-color: #ffffff;
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }
  img { max-width: 100%; display: block; }

  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header */
  header {
    background-color: #0b2545;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    max-width: 1140px;
    margin: 0 auto;
  }
  .logo {
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .logo span {
    color: #f2b134;
  }
  nav ul {
    display: flex;
    gap: 28px;
  }
  nav a {
    color: #e5e9f0;
    font-size: 15px;
    font-weight: 500;
    transition: color 0.2s ease;
  }
  nav a:hover {
    color: #f2b134;
  }
  .header-phone {
    display: none;
  }
  @media (min-width: 768px) {
    .header-phone {
      display: inline-block;
      background-color: #f2b134;
      color: #0b2545;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }
  }

  /* Mobile nav toggle simulation via hiding on small screens */
  @media (max-width: 700px) {
    nav ul {
      gap: 14px;
    }
    nav a {
      font-size: 13px;
    }
    .logo {
      font-size: 18px;
    }
  }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #0b2545 0%, #13315c 60%, #1c4587 100%);
    color: #ffffff;
    padding: 90px 0 100px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(242, 177, 52, 0.08);
    border-radius: 50%;
    top: -150px;
    right: -150px;
  }
  .hero-content {
    max-width: 620px;
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-size: 42px;
    line-height: 1.25;
    margin-bottom: 20px;
    font-weight: 800;
  }
  .hero h1 span {
    color: #f2b134;
  }
  .hero p {
    font-size: 18px;
    color: #d7deeb;
    margin-bottom: 32px;
    max-width: 520px;
  }
  .hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 15px;
    transition: all 0.25s ease;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .btn-primary {
    background-color: #f2b134;
    color: #0b2545;
  }
  .btn-primary:hover {
    background-color: #e0a11f;
  }
  .btn-outline {
    border-color: #ffffff;
    color: #ffffff;
  }
  .btn-outline:hover {
    background-color: #ffffff;
    color: #0b2545;
  }

  @media (max-width: 600px) {
    .hero h1 { font-size: 30px; }
    .hero p { font-size: 16px; }
    .hero { padding: 60px 0 70px; }
  }

  /* Trust bar */
  .trustbar {
    background-color: #f4f6f9;
    padding: 22px 0;
    border-bottom: 1px solid #e5e9f0;
  }
  .trustbar .container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    text-align: center;
  }
  .trust-item {
    font-size: 14px;
    font-weight: 600;
    color: #52606d;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .trust-item .icon {
    color: #f2b134;
    font-size: 18px;
  }

  /* Section styling */
  section {
    padding: 80px 0;
  }
  .section-title {
    text-align: center;
    margin-bottom: 50px;
  }
  .section-title h2 {
    font-size: 32px;
    color: #0b2545;
    margin-bottom: 14px;
    font-weight: 800;
  }
  .section-title p {
    color: #52606d;
    max-width: 600px;
    margin: 0 auto;
    font-size: 16px;
  }
  .section-title .underline {
    width: 60px;
    height: 4px;
    background-color: #f2b134;
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* Services */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
  }
  .service-card {
    background-color: #ffffff;
    border: 1px solid #e5e9f0;
    border-radius: 10px;
    padding: 32px 26px;
    text-align: left;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(11, 37, 69, 0.08);
    border-color: transparent;
  }
  .service-icon {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background-color: #fef3dd;
    color: #f2b134;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 20px;
  }
  .service-card h3 {
    font-size: 19px;
    color: #0b2545;
    margin-bottom: 12px;
    font-weight: 700;
  }
  .service-card p {
    font-size: 15px;
    color: #52606d;
  }

  /* About */
  .about {
    background-color: #f4f6f9;
  }
  .about-inner {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    align-items: center;
  }
  @media (min-width: 900px) {
    .about-inner {
      grid-template-columns: 1fr 1fr;
    }
  }
  .about-text h2 {
    font-size: 30px;
    color: #0b2545;
    margin-bottom: 18px;
    font-weight: 800;
  }
  .about-text p {
    color: #52606d;
    margin-bottom: 16px;
    font-size: 16px;
  }
  .about-list {
    margin-top: 20px;
  }
  .about-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
    color: #1f2933;
    font-size: 15px;
    font-weight: 500;
  }
  .about-list li::before {
    content: "✓";
    color: #f2b134;
    font-weight: 800;
    background-color: #0b2545;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .about-image {
    background: linear-gradient(135deg, #0b2545, #1c4587);
    border-radius: 12px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f2b134;
    font-size: 60px;
    font-weight: 800;
    box-shadow: 0 20px 40px rgba(11,37,69,0.15);
  }

  /* Why us / stats */
  .stats {
    background-color: #0b2545;
    color: #ffffff;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 30px;
    text-align: center;
  }
  .stat-number {
    font-size: 40px;
    font-weight: 800;
    color: #f2b134;
    margin-bottom: 8px;
  }
  .stat-label {
    font-size: 14px;
    color: #d7deeb;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Contact */
  .contact-inner {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
  }
  @media (min-width: 900px) {
    .contact-inner {
      grid-template-columns: 1fr 1fr;
    }
  }
  .contact-card {
    background-color: #ffffff;
    border: 1px solid #e5e9f0;
    border-radius: 12px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(11,37,69,0.06);
  }
  .contact-card h3 {
    color: #0b2545;
    font-size: 22px;
    margin-bottom: 24px;
    font-weight: 800;
  }
  .contact-row {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
    align-items: flex-start;
  }
  .contact-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background-color: #fef3dd;
    color: #f2b134;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .contact-row div h4 {
    font-size: 15px;
    color: #0b2545;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .contact-row div p, .contact-row div a {
    font-size: 15px;
    color: #52606d;
  }
  .contact-row div a:hover {
    color: #f2b134;
  }

  .map-placeholder {
    background: linear-gradient(135deg, #f4f6f9, #e5e9f0);
    border-radius: 12px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #52606d;
    text-align: center;
    padding: 20px;
    border: 1px solid #e5e9f0;
  }

    font-size: 40px;
    color:
