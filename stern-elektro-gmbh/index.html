<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stern Elektro GmbH | Elektriker in Rosenheim</title>
<meta name="description" content="Stern Elektro GmbH – Ihr zuverlässiger Elektriker in Rosenheim. Elektroinstallation, Wartung, Notdienst und mehr aus einer Hand.">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: #263238;
    line-height: 1.6;
    background-color: #ffffff;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  img {
    max-width: 100%;
    display: block;
  }

  /* Header */
  header {
    background-color: #0d3b52;
    color: #ffffff;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .logo span {
    color: #f5a623;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }

  nav ul li a {
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.2s ease;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
  }

  nav ul li a:hover {
    color: #f5a623;
    border-bottom: 2px solid #f5a623;
  }

  .header-phone {
    background-color: #f5a623;
    color: #0d3b52;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.95rem;
    white-space: nowrap;
  }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, rgba(13,59,82,0.92), rgba(13,59,82,0.85)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect fill="%23123f57" width="800" height="600"/><circle cx="700" cy="80" r="180" fill="%23134a66" opacity="0.5"/><circle cx="100" cy="500" r="220" fill="%23134a66" opacity="0.5"/></svg>');
    background-size: cover;
    background-position: center;
    color: #ffffff;
    padding: 100px 24px 110px;
    text-align: center;
  }

  .hero-inner {
    max-width: 800px;
    margin: 0 auto;
  }

  .hero h1 {
    font-size: 2.6rem;
    margin-bottom: 18px;
    font-weight: 700;
    line-height: 1.3;
  }

  .hero p {
    font-size: 1.15rem;
    margin-bottom: 32px;
    color: #d7e4ec;
  }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    padding: 14px 30px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-primary {
    background-color: #f5a623;
    color: #0d3b52;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(245,166,35,0.4);
  }

  .btn-secondary {
    background-color: transparent;
    color: #ffffff;
    border: 2px solid #ffffff;
  }

  .btn-secondary:hover {
    background-color: #ffffff;
    color: #0d3b52;
    transform: translateY(-2px);
  }

  /* Section Layout */
  section {
    padding: 80px 24px;
  }

  .section-container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    text-align: center;
    margin-bottom: 50px;
  }

  .section-title h2 {
    font-size: 2rem;
    color: #0d3b52;
    margin-bottom: 12px;
  }

  .section-title p {
    color: #607d8b;
    font-size: 1.05rem;
    max-width: 600px;
    margin: 0 auto;
  }

  .section-title .underline {
    width: 60px;
    height: 4px;
    background-color: #f5a623;
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* Services */
  .services {
    background-color: #f4f7f9;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
  }

  .service-card {
    background-color: #ffffff;
    border-radius: 10px;
    padding: 32px 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border-top: 4px solid #f5a623;
  }

  .service-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.1);
  }

  .service-icon {
    width: 54px;
    height: 54px;
    background-color: #0d3b52;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .service-icon svg {
    width: 26px;
    height: 26px;
    stroke: #f5a623;
    fill: none;
    stroke-width: 2;
  }

  .service-card h3 {
    font-size: 1.2rem;
    color: #0d3b52;
    margin-bottom: 10px;
  }

  .service-card p {
    color: #546e7a;
    font-size: 0.97rem;
  }

  /* About */
  .about {
    background-color: #ffffff;
  }

  .about-flex {
    display: flex;
    gap: 50px;
    align-items: center;
    flex-wrap: wrap;
  }

  .about-text {
    flex: 1 1 400px;
  }

  .about-text h2 {
    font-size: 2rem;
    color: #0d3b52;
    margin-bottom: 20px;
  }

  .about-text p {
    color: #546e7a;
    margin-bottom: 16px;
  }

  .about-stats {
    flex: 1 1 300px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .stat-box {
    background-color: #0d3b52;
    color: #ffffff;
    padding: 30px 20px;
    border-radius: 10px;
    text-align: center;
  }

  .stat-box .number {
    font-size: 2rem;
    font-weight: 700;
    color: #f5a623;
    margin-bottom: 6px;
  }

  .stat-box .label {
    font-size: 0.9rem;
    color: #d7e4ec;
  }

  /* Why us */
  .why {
    background-color: #f4f7f9;
  }

  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 26px;
  }

  .why-item {
    background-color: #ffffff;
    padding: 26px;
    border-radius: 10px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  }

  .why-item .check {
    min-width: 32px;
    height: 32px;
    background-color: #f5a623;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0d3b52;
    font-weight: 700;
  }

  .why-item h4 {
    color: #0d3b52;
    margin-bottom: 6px;
    font-size: 1.05rem;
  }

  .why-item p {
    color: #607d8b;
    font-size: 0.93rem;
  }

  /* Contact */
  .contact {
    background-color: #0d3b52;
    color: #ffffff;
  }

  .contact .section-title h2 {
    color: #ffffff;
  }

  .contact .section-title p {
    color: #b8cdda;
  }

  .contact-flex {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .contact-info {
    flex: 1 1 320px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .contact-item {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    background-color: rgba(255,255,255,0.06);
    padding: 20px;
    border-radius: 10px;
  }

  .contact-icon {
    min-width: 46px;
    height: 46px;
    background-color: #f5a623;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .contact-icon svg {
    width: 22px;
    height: 22px;
    stroke: #0d3b52;
    fill: none;
    stroke-width: 2;
  }

  .contact-item h4 {
    margin-bottom: 4px;
    font-size: 1.05rem;
  }

  .contact-item p, .contact-item a {
    color: #d7e4ec;
    font-size: 0.95rem;
  }

  .contact-form {
    flex: 1 1 380px;
    background-color: #ffffff;
    border-radius: 10px;
    padding: 34px;
    color: #263238;
  }

  .contact-form h3 {
    color: #0d3b52;
    margin-bottom: 18px;
    font-size: 1.3rem;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #37474f;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cfd8dc;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .form-submit {
    background-color: #0d3b52;
    color: #ffffff;
    border: none;
    padding: 14px 28px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
    width: 100%;
    transition: background-color 0.2s ease;
  }
